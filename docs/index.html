<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python IDE in Browser</title>
    <meta
      name="description"
      content="A simple browser-based Python editor that runs code using Pyodide."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Shareable browser demo</p>
          <h1>Python IDE in your browser</h1>
          <p class="subtitle">
            Write Python, run it instantly, and share this link with anyone.
          </p>
        </div>
        <div class="hero-actions">
          <button id="runButton">Run code</button>
          <button id="exampleButton" class="secondary">Load example</button>
          <button id="clearButton" class="secondary">Clear</button>
        </div>
      </header>

      <section class="workspace">
        <label for="codeEditor">Python editor</label>
        <textarea id="codeEditor" spellcheck="false">
print("Hello from your browser!")
name = input("What is your name? ")
print(f"Nice to meet you, {name}!")
        </textarea>

        <div class="output-panel">
          <div class="output-header">
            <strong>Output</strong>
            <span id="status">Loading Python runtime...</span>
          </div>
          <pre id="output"></pre>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
